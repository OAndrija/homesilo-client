<div
  class="dialog-backdrop"
  (click)="onBackdropClick($event)"
  data-dialog-backdrop
  (keydown)="onKeydown($event)"
>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="name-dialog-title">
    <div class="dialog-header">
      <h2 class="dialog-title" id="name-dialog-title">{{ title }}</h2>
      <button class="icon-btn" type="button" aria-label="Close" (click)="cancel.emit()">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>

    <form class="dialog-body" (submit)="$event.preventDefault(); onConfirm()">
      <label class="field">
        <span class="field-label">Name</span>
        <input
          #nameInput
          id="folderNameInput"
          class="input"
          type="text"
          [placeholder]="placeholder"
          [value]="value()"
          (input)="value.set($any($event.target).value)"
          maxlength="255"
          autocomplete="off"
          spellcheck="false"
        />
      </label>
    </form>

    <div class="dialog-footer">
      <button class="btn btn-ghost" type="button" (click)="cancel.emit()">Cancel</button>
      <button
        class="btn btn-primary btn-confirm"
        type="button"
        [disabled]="!value().trim()"
        (click)="onConfirm()"
      >
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</div>
