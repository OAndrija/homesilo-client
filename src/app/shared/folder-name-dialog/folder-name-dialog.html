<div
  class="dialog-backdrop"
  (click)="onBackdropClick($event)"
  data-dialog-backdrop
  (keydown)="onKeydown($event)"
>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="name-dialog-title">
    <header class="dialog-head">
      <span class="dialog-icon" aria-hidden="true">
        <span class="material-symbols-rounded" aria-hidden="true">{{ icon() }}</span>
      </span>
      <div class="dialog-titles">
        <h3 id="name-dialog-title">{{ title() }}</h3>
        @if (mode() === 'rename') {
          <p class="dialog-sub" [title]="initialName()">Currently “{{ initialName() }}”</p>
        }
      </div>
      <button
        class="dialog-close"
        type="button"
        (click)="cancel.emit()"
        [disabled]="busy()"
        aria-label="Close"
      >
        <span class="material-symbols-rounded" aria-hidden="true">close</span>
      </button>
    </header>

    <div class="dialog-body">
      <label class="dlg-label" for="folderNameInput">Name</label>
      <div class="dlg-input">
        <span class="material-symbols-rounded" aria-hidden="true">{{ inputIcon() }}</span>
        <input
          #nameInput
          id="folderNameInput"
          type="text"
          [placeholder]="mode() === 'rename' ? 'New name' : 'Untitled folder'"
          [value]="value()"
          (input)="value.set($any($event.target).value)"
          [class.invalid]="!!problem() || !!error()"
          [attr.aria-invalid]="!!problem() || !!error()"
          aria-describedby="name-dialog-error"
          [disabled]="busy()"
          maxlength="255"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      @if (problem() || error(); as message) {
        <div class="dlg-error" id="name-dialog-error" role="alert">
          <span class="material-symbols-rounded" aria-hidden="true">error</span>
          <span>{{ message }}</span>
        </div>
      }
    </div>

    <footer class="dialog-foot">
      <button class="dlg-btn secondary" type="button" (click)="cancel.emit()" [disabled]="busy()">
        Cancel
      </button>
      <button
        class="dlg-btn primary btn-confirm"
        type="button"
        [disabled]="!canSave()"
        (click)="onConfirm()"
      >
        @if (busy()) {
          <span class="dlg-spinner" aria-hidden="true"></span>
          Saving…
        } @else {
          {{ confirmLabel() }}
        }
      </button>
    </footer>
  </div>
</div>
