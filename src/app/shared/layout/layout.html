<div class="app-shell" [class.sidebar-open]="sidebarOpen()">
  <div class="backdrop" (click)="toggleSidebar()"></div>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">
        <img src="homesilo-logo.png" alt="HomeSilo logo" width="64" height="64" />
      </div>
      <span class="logo-text">homesilo</span>
    </div>
    <nav class="sidebar-nav">
      <a
        routerLink="/home"
        routerLinkActive="active"
        class="nav-link"
        title="Home"
        (click)="closeOnMobile()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">home</span>
        <span class="nav-label">Home</span>
      </a>
      <a
        routerLink="/my-files"
        routerLinkActive="active"
        class="nav-link"
        title="My Files"
        (click)="closeOnMobile()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">folder</span>
        <span class="nav-label">My Files</span>
      </a>
      <a
        routerLink="/starred"
        routerLinkActive="active"
        class="nav-link"
        title="Starred"
        (click)="closeOnMobile()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">star</span>
        <span class="nav-label">Starred</span>
      </a>
      <a
        routerLink="/trash"
        routerLinkActive="active"
        class="nav-link"
        title="Trash"
        (click)="closeOnMobile()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">delete</span>
        <span class="nav-label">Trash</span>
      </a>
      @if (auth.isAdmin()) {
        <div class="nav-divider" role="presentation"></div>
        <a
          routerLink="/admin/users"
          routerLinkActive="active"
          class="nav-link"
          title="Users"
          (click)="closeOnMobile()"
        >
          <span class="material-symbols-rounded" aria-hidden="true">manage_accounts</span>
          <span class="nav-label">Users</span>
        </a>
        <a
          routerLink="/admin/activity"
          routerLinkActive="active"
          class="nav-link"
          title="Activity"
          (click)="closeOnMobile()"
        >
          <span class="material-symbols-rounded" aria-hidden="true">history</span>
          <span class="nav-label">Activity</span>
        </a>
      }
    </nav>

    <app-storage-indicator [sidebarOpen]="sidebarOpen()" />
  </aside>

  <div class="main-area">
    <header class="topbar">
      <button class="menu-btn" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <span class="material-symbols-rounded" aria-hidden="true">
          {{ sidebarOpen() ? 'chevron_left' : 'chevron_right' }}
        </span>
      </button>

      @if (!isHome()) {
        <div class="search-bar">
          <span class="material-symbols-rounded" aria-hidden="true">search</span>
          <input
            type="text"
            class="search-input"
            placeholder="Search in homesilo..."
            [value]="searchInputValue()"
            (input)="onSearchInput($event)"
            (keydown.escape)="onClearSearch()"
            aria-label="Search files"
          />
          @if (searchInputValue()) {
            <button
              class="search-clear-btn"
              (click)="onClearSearch()"
              aria-label="Clear search"
              type="button"
            >
              <span class="material-symbols-rounded" aria-hidden="true">close</span>
            </button>
          }
        </div>
      }
      <div class="topbar-user">
        <app-account-menu />
      </div>
    </header>
    <main
      class="page-content"
      [class.upload-panel-open]="uploads.items().length > 0 && !uploads.collapsed()"
      [class.upload-panel-collapsed]="uploads.items().length > 0 && uploads.collapsed()"
    >
      <router-outlet></router-outlet>
    </main>

    <app-toast-host />
    <app-upload-panel />
  </div>
</div>

<app-file-preview />
<app-properties-dialog />
