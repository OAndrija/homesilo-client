<div class="storage" [attr.data-level]="level()">
  <div class="storage-head">
    <span class="storage-title">Storage</span>
    @if (loaded()) {
      <span class="storage-percent tabular"
        >{{ percent() < 1 && percent() > 0 ? '<1' : (percent() | number: '1.0-0') }}%</span
      >
    }
  </div>
  <div
    class="storage-track"
    role="progressbar"
    aria-label="Storage used"
    [attr.aria-valuenow]="percent() | number: '1.0-0'"
    aria-valuemin="0"
    aria-valuemax="100"
  >
    <div class="storage-fill" [style.width.%]="percent()"></div>
  </div>
  <p class="storage-text tabular">{{ loaded() ? label() : ' ' }}</p>
</div>
