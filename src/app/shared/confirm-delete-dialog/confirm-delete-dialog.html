<div
  class="dialog-backdrop"
  (click)="onBackdropClick($event)"
  (keydown)="onKeydown($event)"
  data-dialog-backdrop
>
  <div
    class="dialog"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="delete-title"
    aria-describedby="delete-message"
  >
    <div class="dialog-header">
      <h2 class="dialog-title" id="delete-title">{{ title() }}</h2>
      <button class="icon-btn" type="button" aria-label="Close" (click)="cancel.emit()">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
    <div class="dialog-body">
      <p id="delete-message">{{ message() }}</p>
    </div>
    <div class="dialog-footer">
      <button #cancelButton class="btn btn-ghost" type="button" (click)="cancel.emit()">
        Cancel
      </button>
      <button class="btn btn-danger" type="button" (click)="confirm.emit()">Delete forever</button>
    </div>
  </div>
</div>
