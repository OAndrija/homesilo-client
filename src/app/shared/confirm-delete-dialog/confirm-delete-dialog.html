<div
  class="dialog-backdrop"
  (click)="onBackdropClick($event)"
  (keydown)="onKeydown($event)"
  data-dialog-backdrop
>
  <div
    class="dialog"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="delete-dialog-title"
    aria-describedby="delete-dialog-message"
  >
    <header class="dialog-head">
      <span class="dialog-icon danger" aria-hidden="true">
        <span class="material-symbols-rounded" aria-hidden="true">delete_forever</span>
      </span>
      <div class="dialog-titles">
        <h3 id="delete-dialog-title">{{ title() }}</h3>
        <p class="dialog-sub">This can’t be undone.</p>
      </div>
      <button class="dialog-close" type="button" (click)="cancel.emit()" aria-label="Close">
        <span class="material-symbols-rounded" aria-hidden="true">close</span>
      </button>
    </header>

    <div class="dialog-body">
      <p class="dialog-message" id="delete-dialog-message">{{ message() }}</p>
    </div>

    <footer class="dialog-foot">
      <button #cancelButton class="dlg-btn secondary" type="button" (click)="cancel.emit()">
        Cancel
      </button>
      <button class="dlg-btn danger btn-danger" type="button" (click)="confirm.emit()">
        Delete forever
      </button>
    </footer>
  </div>
</div>
