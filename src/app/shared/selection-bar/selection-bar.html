@if (selectedCount() > 0) {
  <div class="selection-bar" data-selection-bar role="toolbar" aria-label="Selected items">
    <button
      type="button"
      class="icon-btn clear"
      aria-label="Clear selection"
      (click)="clearSelection.emit()"
    >
      <span class="material-symbols-rounded">close</span>
    </button>
    <span class="count tabular">{{ selectedCount() }} selected</span>

    <div class="actions">
      @if (hasAction('download')) {
        <button type="button" class="bar-btn" (click)="downloadAll.emit()" title="Download">
          <span class="material-symbols-rounded" aria-hidden="true">download</span>
          <span class="bar-label">Download</span>
        </button>
      }
      @if (hasAction('move')) {
        <button type="button" class="bar-btn" (click)="moveAll.emit()" title="Move to…">
          <span class="material-symbols-rounded" aria-hidden="true">drive_file_move</span>
          <span class="bar-label">Move</span>
        </button>
      }
      @if (hasAction('star')) {
        <button type="button" class="bar-btn" (click)="starAll.emit()" title="Toggle star">
          <span class="material-symbols-rounded" aria-hidden="true">star</span>
          <span class="bar-label">Star</span>
        </button>
      }
      @if (hasAction('restore')) {
        <button type="button" class="bar-btn" (click)="restoreAll.emit()" title="Restore">
          <span class="material-symbols-rounded" aria-hidden="true">restore_from_trash</span>
          <span class="bar-label">Restore</span>
        </button>
      }
      @if (hasAction('trash')) {
        <button
          type="button"
          class="bar-btn is-danger"
          (click)="trashAll.emit()"
          title="Move to trash"
        >
          <span class="material-symbols-rounded" aria-hidden="true">delete</span>
          <span class="bar-label">Trash</span>
        </button>
      }
      @if (hasAction('deleteForever')) {
        <button
          type="button"
          class="bar-btn is-danger"
          (click)="deleteForeverAll.emit()"
          title="Delete forever"
        >
          <span class="material-symbols-rounded" aria-hidden="true">delete_forever</span>
          <span class="bar-label">Delete forever</span>
        </button>
      }
    </div>
  </div>
}
