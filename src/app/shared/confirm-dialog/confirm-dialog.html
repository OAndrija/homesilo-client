<div
  class="dialog-backdrop"
  (click)="onBackdropClick($event)"
  (keydown)="onKeydown($event)"
  data-dialog-backdrop
>
  <div
    class="dialog"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    aria-describedby="confirm-dialog-message"
  >
    <header class="dialog-head">
      <span class="dialog-icon" [class.danger]="tone() === 'danger'" aria-hidden="true">
        <span class="material-symbols-rounded" aria-hidden="true">{{ icon() }}</span>
      </span>
      <div class="dialog-titles">
        <h3 id="confirm-dialog-title">{{ title() }}</h3>
        @if (note()) {
          <p class="dialog-sub">{{ note() }}</p>
        }
      </div>
      <button class="dialog-close" type="button" (click)="cancel.emit()" aria-label="Close">
        <span class="material-symbols-rounded" aria-hidden="true">close</span>
      </button>
    </header>

    <div class="dialog-body">
      <p class="dialog-message" id="confirm-dialog-message">{{ message() }}</p>
    </div>

    <footer class="dialog-foot">
      <button #cancelButton class="dlg-btn secondary" type="button" (click)="cancel.emit()">
        Cancel
      </button>
      <button
        class="dlg-btn"
        [class.primary]="tone() !== 'danger'"
        [class.danger]="tone() === 'danger'"
        type="button"
        (click)="confirm.emit()"
      >
        {{ confirmLabel() }}
      </button>
    </footer>
  </div>
</div>
