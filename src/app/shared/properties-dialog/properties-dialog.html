@if (target(); as t) {
  <div
    class="dialog-backdrop"
    (click)="onBackdropClick($event)"
    (keydown)="onKeydown($event)"
    data-dialog-backdrop
  >
    <div
      class="dialog properties"
      role="dialog"
      aria-modal="true"
      aria-labelledby="properties-title"
      aria-describedby="properties-kind"
    >
      <header class="dialog-head">
        <span class="visual" [style.--tint]="icon().color" aria-hidden="true">
          @if (thumbnail(); as src) {
            <img [src]="src" alt="" (error)="thumbBroken.set(true)" />
          } @else {
            <span class="material-symbols-rounded">{{ icon().icon }}</span>
          }
        </span>
        <div class="dialog-titles">
          <h3 id="properties-title" [title]="name()">{{ name() }}</h3>
          <p class="dialog-sub" id="properties-kind">
            {{ kind() }}{{ trashed() ? ' · in the trash' : '' }}
          </p>
        </div>
        <button
          #closeButton
          class="dialog-close"
          type="button"
          (click)="close()"
          aria-label="Close properties"
        >
          <span class="material-symbols-rounded" aria-hidden="true">close</span>
        </button>
      </header>

      <div class="dialog-body">
        <app-item-details [target]="t" (goTo)="goTo($event)" (loaded)="loaded.set($event)" />
      </div>

      <footer class="dialog-foot">
        @if (file() && !trashed()) {
          <button class="dlg-btn secondary" type="button" (click)="download()">
            <span class="material-symbols-rounded" aria-hidden="true">download</span>
            Download
          </button>
          <button class="dlg-btn primary" type="button" (click)="openFile()">
            <span class="material-symbols-rounded" aria-hidden="true">visibility</span>
            Open
          </button>
        } @else if (folder() && !trashed()) {
          <button class="dlg-btn primary" type="button" (click)="goTo(folder()!.id)">
            <span class="material-symbols-rounded" aria-hidden="true">folder_open</span>
            Open folder
          </button>
        } @else {
          <button class="dlg-btn secondary" type="button" (click)="close()">Close</button>
        }
      </footer>
    </div>
  </div>
}
