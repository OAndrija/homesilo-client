<div
  class="dialog-backdrop"
  (click)="onBackdropClick($event)"
  (keydown.escape)="cancel.emit()"
  data-dialog-backdrop
>
  <div class="dialog picker" role="dialog" aria-modal="true" aria-labelledby="move-title">
    <div class="dialog-header">
      <h2 class="dialog-title" id="move-title">Move to</h2>
      <button class="icon-btn" type="button" aria-label="Close" (click)="cancel.emit()">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>

    <nav class="breadcrumb picker-crumbs" aria-label="Location">
      <button
        type="button"
        class="crumb"
        [class.is-current]="!currentFolder()"
        (click)="navigateToBreadcrumb(null)"
      >
        <span class="material-symbols-rounded" aria-hidden="true">home</span>
        My Files
      </button>
      @for (crumb of breadcrumb(); track crumb.id; let last = $last) {
        <span class="material-symbols-rounded crumb-sep" aria-hidden="true">chevron_right</span>
        <button
          type="button"
          class="crumb"
          [class.is-current]="last"
          (click)="navigateToBreadcrumb(crumb)"
        >
          {{ crumb.name }}
        </button>
      }
    </nav>

    <div class="picker-list">
      @if (loading()) {
        <div class="picker-state"><span class="spinner"></span></div>
      } @else if (subfolders().length === 0) {
        <div class="picker-state">No folders in here</div>
      } @else {
        <ul>
          @for (folder of subfolders(); track folder.id) {
            <li>
              <button type="button" class="picker-item" (click)="navigateTo(folder)">
                <span class="material-symbols-rounded is-filled picker-icon" aria-hidden="true"
                  >folder</span
                >
                <span class="picker-name">{{ folder.name }}</span>
                <span class="material-symbols-rounded picker-chevron" aria-hidden="true"
                  >chevron_right</span
                >
              </button>
            </li>
          }
        </ul>
      }
    </div>

    <div class="dialog-footer picker-footer">
      <button class="btn btn-ghost" type="button" (click)="cancel.emit()">Cancel</button>
      @if (isSource()) {
        <span class="picker-hint">Already in this folder</span>
      }
      <button
        class="btn btn-primary"
        type="button"
        [disabled]="isSource() || loading()"
        (click)="moveHere()"
      >
        Move to {{ currentFolder()?.name ?? 'My Files' }}
      </button>
    </div>
  </div>
</div>
