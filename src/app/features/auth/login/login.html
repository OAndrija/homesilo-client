<div class="auth">
  <aside class="brand-side">
    <div class="brand">
      <img src="homesilo-logo.png" alt="" width="40" height="40" />
      <span class="wordmark">HomeSilo</span>
    </div>
    <div class="pitch">
      <h1>Your files,<br />kept at home.</h1>
      <p>Sign in to the HomeSilo server running on your own hardware.</p>
    </div>
    <p class="footnote">
      <span class="material-symbols-rounded" aria-hidden="true">lock</span>
      Self-hosted. Nothing is sent to anyone else’s cloud.
    </p>
    <svg class="silo-art" viewBox="0 0 200 300" aria-hidden="true">
      <defs>
        <clipPath id="silo-body">
          <path d="M40 90 H160 V270 H40 Z" />
        </clipPath>
      </defs>
      <g clip-path="url(#silo-body)">
        <rect class="grain" x="40" y="218" width="120" height="52" />
        <rect class="grain g2" x="40" y="184" width="120" height="34" />
        <rect class="grain g3" x="40" y="160" width="120" height="24" />
      </g>
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <path d="M40 90 C40 40 160 40 160 90" />
        <path d="M40 90 V270 M160 90 V270" />
        <path d="M30 270 H170" />
        <path d="M40 90 H160 M40 130 H160 M40 175 H160 M40 220 H160" stroke-opacity="0.5" />
        <rect x="92" y="34" width="16" height="12" rx="2" />
      </g>
    </svg>
  </aside>

  <main class="form-side">
    <div class="form-card">
      <h2>Sign in</h2>
      <p class="form-lead">Welcome back. Use your username or email.</p>

      @if (errorMessage()) {
        <div class="form-alert is-error" role="alert">{{ errorMessage() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <label class="field">
          <span class="field-label">Username or email</span>
          <input
            id="username"
            class="input"
            type="text"
            formControlName="username"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            [class.is-invalid]="submitted && username.errors"
            [attr.aria-invalid]="submitted && !!username.errors"
          />
          @if (submitted && username.errors?.['required']) {
            <span class="field-error">Enter your username or email</span>
          }
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <input
            id="password"
            class="input"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            [class.is-invalid]="submitted && password.errors"
            [attr.aria-invalid]="submitted && !!password.errors"
          />
          @if (submitted && password.errors?.['required']) {
            <span class="field-error">Enter your password</span>
          }
        </label>

        <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner" aria-hidden="true"></span>
            Signing in…
          } @else {
            Sign in
          }
        </button>
      </form>

      <p class="switch">New here? <a routerLink="/register">Create an account</a></p>
    </div>
  </main>
</div>
