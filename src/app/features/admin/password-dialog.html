<div
  class="dialog-backdrop"
  data-dialog-backdrop
  (click)="onBackdropClick($event)"
  (keydown)="onKeydown($event)"
>
  <form
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="password-title"
    (submit)="$event.preventDefault(); submit()"
    novalidate
  >
    <header class="dialog-head">
      <span class="dialog-icon" aria-hidden="true">
        <span class="material-symbols-rounded" aria-hidden="true">key</span>
      </span>
      <div class="dialog-titles">
        <h3 id="password-title">Set a new password</h3>
        <p class="dialog-sub">For {{ user().username }}</p>
      </div>
      <button
        class="dialog-close"
        type="button"
        (click)="cancel.emit()"
        [disabled]="busy()"
        aria-label="Close"
      >
        <span class="material-symbols-rounded" aria-hidden="true">close</span>
      </button>
    </header>

    <div class="dialog-body form">
      <div class="field">
        <label class="dlg-label" for="reset-password">
          New password
          <span class="label-note">{{ copied() ? 'Copied' : 'Share it with them' }}</span>
        </label>
        <div class="dlg-input with-actions">
          <span class="material-symbols-rounded" aria-hidden="true">password</span>
          <input
            #field
            id="reset-password"
            class="mono"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="new-password"
            spellcheck="false"
            maxlength="128"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            [class.invalid]="tooShort()"
            [attr.aria-invalid]="tooShort()"
            aria-describedby="reset-password-hint"
            [disabled]="busy()"
          />
          <div class="input-actions">
            <button
              type="button"
              class="input-action"
              (click)="showPassword.set(!showPassword())"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
              [title]="showPassword() ? 'Hide' : 'Show'"
            >
              <span class="material-symbols-rounded" aria-hidden="true">{{
                showPassword() ? 'visibility_off' : 'visibility'
              }}</span>
            </button>
            <button
              type="button"
              class="input-action"
              (click)="copy()"
              aria-label="Copy password"
              title="Copy"
            >
              <span class="material-symbols-rounded" aria-hidden="true">{{
                copied() ? 'check' : 'content_copy'
              }}</span>
            </button>
            <button
              type="button"
              class="input-action"
              (click)="regenerate()"
              aria-label="Generate a new password"
              title="Generate another"
            >
              <span class="material-symbols-rounded" aria-hidden="true">autorenew</span>
            </button>
          </div>
        </div>
        @if (tooShort()) {
          <div class="field-error" id="reset-password-hint">Use at least 8 characters</div>
        } @else {
          <div class="field-hint" id="reset-password-hint">
            {{ user().username }} will be signed out on every device and can sign in with this
            password. They can change it in Settings afterwards.
          </div>
        }
      </div>

      @if (error()) {
        <div class="dlg-error" role="alert">
          <span class="material-symbols-rounded" aria-hidden="true">error</span>
          <span>{{ error() }}</span>
        </div>
      }
    </div>

    <footer class="dialog-foot">
      <button class="dlg-btn secondary" type="button" (click)="cancel.emit()" [disabled]="busy()">
        Cancel
      </button>
      <button class="dlg-btn primary" type="submit" [disabled]="tooShort() || busy()">
        @if (busy()) {
          <span class="dlg-spinner" aria-hidden="true"></span>
          Saving…
        } @else {
          Set password
        }
      </button>
    </footer>
  </form>
</div>
