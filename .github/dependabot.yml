# Weekly pull requests for dependency updates; security fixes come as soon as
# they're published. Minor and patch updates are grouped to keep the noise down.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "typescript", "zone.js"]
        update-types: [minor, patch]
      tooling:
        patterns: ["*"]
        exclude-patterns: ["@angular/*", "@angular-devkit/*", "typescript"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
