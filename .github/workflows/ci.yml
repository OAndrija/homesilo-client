name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Fails on known high or critical vulnerabilities in what ships to browsers.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t homesilo-client:ci .
      # Known vulnerabilities in the image (nginx, Alpine packages) that have a fix available.
      - name: Scan image
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1
          image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress homesilo-client:ci
