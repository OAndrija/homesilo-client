# Publishes a release when a version tag (v1.2.3) is pushed: tests, then the
# web client image for amd64 and arm64 on GHCR, then a GitHub release.
# Releases go together with the server; see RELEASING.md in homesilo-server.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/oandrija/homesilo-client

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but package.json says $version. Run npm version first."
            exit 1
          fi

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx ng test --watch=false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=HomeSilo web client
            org.opencontainers.image.description=The web app for HomeSilo, a self-hosted file drive, served by nginx

      # Scanned before anything is published: a known, fixable, serious vulnerability stops the release.
      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: homesilo-client:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1
          image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress homesilo-client:scan

      - id: push
        name: Build and publish (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf 'The web client for HomeSilo %s. Release notes are in the [server changelog](https://github.com/OAndrija/homesilo-server/blob/%s/CHANGELOG.md).\n' \
            "$version" "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "HomeSilo ${version} (web client)" --notes-file notes.md --verify-tag
